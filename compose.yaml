# Local stack: relocd with its own throwaway database.
#
# Secrets are files outside the project, so they can't end up in the build
# context or in git. They are separate from the ones in .envrc: this is
# another database. Create them once:
#
#   (umask 077 && mkdir -p "$HOME/.config/reloc/compose")
#   (umask 077 && openssl rand -hex 32 > "$HOME/.config/reloc/compose/pgpassword")
#   (umask 077 && openssl rand -hex 32 > "$HOME/.config/reloc/compose/relocd_token")
#
# The database takes the password only when its volume is created; after
# changing the file, recreate the volume with "docker compose down -v".
#
# Host ports have no defaults either, set them in .envrc:
#
#   RELOC_COMPOSE_PGPORT  the database, for psql or a GUI client
#   RELOCD_COMPOSE_PORT   the API
#
# Both listen only on 127.0.0.1.
#
# Nothing runs implicitly, migrations included:
#
#   docker compose run --rm reloc migrate
#   docker compose up -d
#   docker compose run --rm reloc client list -server-id 1

name: reloc

# Ignored by compose itself, only holds the anchor shared by the services.
x-postgres-env: &postgres-env
  RELOC_PGDSN: postgres://reloc@pg:5432/reloc?sslmode=disable
  RELOC_PGPASSWORD_FILE: /run/secrets/pgpassword

services:
  pg:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: reloc
      POSTGRES_DB: reloc
      POSTGRES_PASSWORD_FILE: /run/secrets/pgpassword
    secrets:
      - pgpassword
    volumes:
      # The image keeps data in /var/lib/postgresql/18/docker; mounting the
      # parent lets a future major version live next to it in the same volume.
      - pg:/var/lib/postgresql
    healthcheck:
      # Over TCP: during first init Postgres listens only on a Unix socket,
      # and a socket check would pass before the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "reloc", "-d", "reloc"]
      interval: 2s
      timeout: 5s
      retries: 15
    # noinspection ComposeUnknownValues
    ports:
      - "127.0.0.1:${RELOC_COMPOSE_PGPORT:?set it in .envrc}:5432"

  # The CLI, only for "docker compose run": the profile keeps it out of
  # "docker compose up".
  reloc:
    build:
      context: .
      target: reloc
    image: reloc:dev
    profiles: [cli]
    read_only: true
    environment:
      <<: *postgres-env
    secrets:
      - pgpassword
    depends_on:
      pg:
        condition: service_healthy

  relocd:
    build:
      context: .
      target: relocd
    image: relocd:dev
    # Nothing writes to the container's filesystem: secrets are mounted,
    # configs go to hosts over ssh.
    read_only: true
    environment:
      <<: *postgres-env
      RELOCD_ADDR: 0.0.0.0:8080
      RELOCD_TOKEN_FILE: /run/secrets/relocd_token
    secrets:
      - pgpassword
      - relocd_token
    healthcheck:
      # The image has no curl: relocd itself asks its /readyz. Timeouts line
      # up: readyz pings the database for 1s, the probe waits 2s, docker 3s.
      test: ["CMD", "relocd", "probe", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Longer than relocd's shutdown timeout, so a running apply finishes
    # before compose sends SIGKILL. Keep in sync with cmd/relocd/main.go.
    stop_grace_period: 25s
    # noinspection ComposeUnknownValues
    ports:
      - "127.0.0.1:${RELOCD_COMPOSE_PORT:?set it in .envrc}:8080"
    depends_on:
      pg:
        condition: service_healthy

secrets:
  pgpassword:
    file: ${HOME}/.config/reloc/compose/pgpassword
  relocd_token:
    file: ${HOME}/.config/reloc/compose/relocd_token

volumes:
  pg:
