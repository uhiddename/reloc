# HTTPS from outside the cluster to relocd, through Traefik, the ingress
# controller k3s ships. k3d.yaml publishes Traefik's 443 as 127.0.0.1:8443:
#
#   curl --insecure https://127.0.0.1:8443/livez
#
# --insecure only until cert-manager issues a certificate: for now Traefik
# answers with its own self-signed one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relocd
  namespace: reloc
  annotations:
    # HTTPS only: the API carries the token, plain HTTP is not served
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    # No host: every name that reaches 127.0.0.1:8443 goes to relocd. A host
    # comes with the real domain and its certificate.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relocd
                port:
                  name: http
