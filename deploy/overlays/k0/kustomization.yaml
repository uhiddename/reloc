# The k0 server (infra/) at https://reloc.hiddename.dev, with a certificate
# from Let's Encrypt (letsencrypt.yaml). kubectl reaches k0 through an ssh
# tunnel, see infra/ansible/roles/k3s/defaults/main.yaml:
#
#   export KUBECONFIG="$HOME/.config/reloc/k8s/k0.yaml"
#   kubectl diff --kustomize=deploy/overlays/k0
#   kubectl apply --kustomize=deploy/overlays/k0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - letsencrypt.yaml

# The commit to run: both images always get the same tag.
images:
  - name: registry.gitlab.com/reloc0/reloc/reloc
    newTag: b16131ca
  - name: registry.gitlab.com/reloc0/reloc/relocd
    newTag: b16131ca

# The placeholders of base/ingress.yaml, as in the k3d overlay.
patches:
  - target:
      kind: Certificate
      name: relocd
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: reloc.hiddename.dev
      # Let's Encrypt production. For a new name or a changed solver, try
      # letsencrypt-staging first: its certificates are not trusted, but
      # its rate limits are generous, so mistakes cost nothing.
      - op: replace
        path: /spec/issuerRef/name
        value: letsencrypt
  - target:
      kind: Ingress
      name: relocd
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: reloc.hiddename.dev
      - op: replace
        path: /spec/rules/0/host
        value: reloc.hiddename.dev
  # Cloudflare Access is in front of k0 (infra/access.tf), and relocd
  # checks its JWT on everything but the probes. The values are terraform
  # output cf_access_issuer and cf_access_aud; neither is a secret.
  - target:
      kind: Deployment
      name: relocd
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RELOCD_CF_ACCESS
          value: "1"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RELOCD_CF_ACCESS_ISSUER
          value: https://divine-band-6bfb.cloudflareaccess.com
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: RELOCD_CF_ACCESS_AUDIENCE
          value: 81ddbcb27009a64bcd0cb368bd3a638709e13a3be7257d16af22776a5cae9430
