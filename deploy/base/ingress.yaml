# HTTPS from outside the cluster to relocd, through Traefik, the ingress
# controller k3s ships.
#
# The host name and the issuer differ per cluster, so here they are
# placeholders: reloc.invalid can never resolve (.invalid is reserved), and
# no issuer is called set-by-overlay. Each overlay replaces both; applying
# the base alone gives a certificate that is never issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: relocd
  namespace: reloc
spec:
  # cert-manager keeps the key and the certificate here and renews them
  # before they expire; the Ingress below only reads the Secret.
  secretName: relocd-tls
  dnsNames:
    - reloc.invalid
  privateKey:
    algorithm: ECDSA
    size: 256
  # Apple platforms reject a server certificate without "server auth".
  # "key encipherment" is for RSA keys only, so ECDSA leaves it out.
  usages:
    - digital signature
    - server auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: set-by-overlay
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relocd
  namespace: reloc
  annotations:
    # HTTPS only: the API carries the token, plain HTTP is not served
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  # TLS for this host with the certificate above
  tls:
    - hosts:
        - reloc.invalid
      secretName: relocd-tls
  rules:
    # Only this name: a request for any other host gets Traefik's 404
    - host: reloc.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: relocd
                port:
                  name: http
