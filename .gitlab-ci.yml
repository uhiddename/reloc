# CI for reloc. Pipelines run for merge requests and for main only: without
# these rules a push to a branch with an open MR starts two identical
# pipelines, one for the branch and one for the MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  # The same image as the build stage of the Dockerfile; bump both together.
  image: golang:1.27.3@sha256:e519d3b0a5b285e5aa53ab9eef02bc6bbb9cb04608389b743a136a9ce75f0d1e
  # a newer push to the same MR cancels the old pipeline
  interruptible: true
  timeout: 10m

variables:
  # Caches must live inside the project directory for GitLab to keep them.
  # Directories starting with a dot are skipped by ./..., so Go doesn't
  # treat the downloaded modules as part of the project.
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

# Each stage starts only after the previous one passed: an image reaches the
# registry only when its tests passed and its scan found nothing to fix.
stages:
  - test
  - build
  - scan
  - push

# Shared by the jobs that compile: modules and build results survive between
# pipelines. The key changes with go.sum, so new dependencies start a new
# cache instead of growing the old one forever.
.go-cache:
  cache:
    key:
      files: [go.sum]
    paths:
      - .cache/go-mod
      - .cache/go-build

lint:
  stage: test
  extends: .go-cache
  script:
    # gofmt lists badly formatted files and still exits 0, so fail on output.
    # Only tracked files: the caches above hold other modules' sources.
    - test -z "$(gofmt -l $(git ls-files '*.go') | tee /dev/stderr)"
    - go vet ./...
    # go.mod and go.sum must already be tidy; -diff prints what would change
    - go mod tidy -diff
    # the downloaded modules must match go.sum
    - go mod verify

test:
  stage: test
  extends: .go-cache
  services:
    # A throwaway database for this job only: it lives on the job's network
    # and is gone when the job ends.
    - name: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
      alias: pg
  variables:
    # Read by the postgres service on its first start.
    POSTGRES_USER: reloc
    POSTGRES_DB: reloc
    # Not a secret: it guards a database nobody else can reach, for a few
    # minutes. It is spelled out so that nobody mistakes it for one.
    POSTGRES_PASSWORD: ci-throwaway
    # Read by package config, see .envrc.example.
    RELOC_PGDSN: postgres://reloc@pg:5432/reloc?sslmode=disable
    RELOC_PGPASSWORD_FILE: /tmp/reloc-pgpassword
  script:
    # the password goes through a file, as everywhere else
    - (umask 077 && printf '%s' "$POSTGRES_PASSWORD" > "$RELOC_PGPASSWORD_FILE")
    # gotestsum runs go test and also writes a JUnit report for the MR page
    - >
      go run gotest.tools/gotestsum@v1.13.0
      --junitfile=junit.xml --format=pkgname
      -- -race -timeout=5m -count=1 -coverprofile=coverage.out ./...
    # the last line, "total: (statements) N%", is what coverage below reads
    - go tool cover -func=coverage.out | tail -n 1
  coverage: '/total:\s+\(statements\)\s+\d+\.\d+%/'
  artifacts:
    # upload the report even when tests fail: that is when it matters
    when: always
    reports:
      junit: junit.xml
    expire_in: 1 week

vulncheck:
  stage: test
  extends: .go-cache
  script:
    # Known vulnerabilities in the dependencies and the standard library.
    # It fails only on those the code can reach, not on every listed module.
    - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

# A Docker daemon for the job (Docker-in-Docker). It needs a privileged
# runner, and gitlab.com shared runners are.
.dind:
  # Only the docker CLI: the daemon it talks to is the service.
  image: docker:29.9.3-cli@sha256:2357639ad1ea7d0194134bf3292622fd4e562483966ed674e5d7c945b5f3b28d
  services:
    - name: docker:29.9.3-dind@sha256:08a98015fce594af7c382883bea080ea206de74402a95da9dc52b6428c8cd121
      alias: docker
  variables:
    # The daemon writes TLS certificates to /certs; the runner shares the
    # client half with the job, and the CLI talks to the daemon over TLS.
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

build:
  stage: build
  extends: .dind
  script:
    - mkdir -p images
    - |
      for target in reloc relocd; do
        image="$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_SHORT_SHA"
        docker build \
          --target="$target" \
          --build-arg=VERSION="$CI_COMMIT_SHORT_SHA" \
          --label=org.opencontainers.image.source="$CI_PROJECT_URL" \
          --label=org.opencontainers.image.revision="$CI_COMMIT_SHA" \
          --label=org.opencontainers.image.version="$CI_COMMIT_SHORT_SHA" \
          --label=org.opencontainers.image.created="$CI_PIPELINE_CREATED_AT" \
          --tag="$image" \
          .
        # the version must have reached the binary through -X
        got=$(docker run --rm "$image" version)
        [ "$got" = "$target $CI_COMMIT_SHORT_SHA" ] || { echo "version: got \"$got\""; exit 1; }
        # the daemon is gone with this job: scan and push get the image as a file
        docker save --output="images/$target.tar" "$image"
      done
  artifacts:
    paths:
      - images/
    expire_in: 1 day

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    # the image runs trivy by default; the job needs a shell instead
    entrypoint: [""]
  variables:
    # the vulnerability database, kept between pipelines
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.cache/trivy
  cache:
    key: trivy
    paths:
      - .cache/trivy
  script:
    # Scan both images even when the first fails, then fail if either did.
    # Only HIGH and CRITICAL with a fixed version: those can be acted on now.
    - |
      status=0
      for target in reloc relocd; do
        trivy image \
          --input="images/$target.tar" \
          --severity=HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code=1 \
          --no-progress \
          || status=1
      done
      exit "$status"

push:
  stage: push
  extends: .dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # once started, a push finishes: a newer pipeline doesn't cancel it halfway
  interruptible: false
  script:
    # the password is a token of this job and expires with it
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username="$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      for target in reloc relocd; do
        # load keeps the name the image was saved with
        docker load --input="images/$target.tar"
        docker push "$CI_REGISTRY_IMAGE/$target:$CI_COMMIT_SHORT_SHA"
      done
