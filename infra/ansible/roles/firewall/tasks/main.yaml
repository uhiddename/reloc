# A firewall on the server itself, behind Hetzner's: files/host-firewall.nft
# says what it lets in, and why it leaves forward to k3s.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

# Off, but not stopped: stopping it runs "nft flush ruleset", which would
# remove the rules of k3s.
- name: Keep Debian's nftables service off
  ansible.builtin.systemd_service:
    name: nftables
    enabled: false

- name: Write the firewall rules
  ansible.builtin.copy:
    src: host-firewall.nft
    dest: /etc/host-firewall.nft
    owner: root
    group: root
    mode: "0644"
    # rules nft can't parse are never written
    validate: /usr/sbin/nft --check --file %s
  register: firewall_rules

- name: Install the firewall service
  ansible.builtin.copy:
    src: host-firewall.service
    dest: /etc/systemd/system/host-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: firewall_unit

- name: Enable the firewall service
  ansible.builtin.systemd_service:
    name: host-firewall
    enabled: true
    daemon_reload: true

# New rules could cut ssh off. So before they load, a timer is set to
# remove them in two minutes, and only a new ssh connection that gets
# through cancels it. If none does, the play fails here and the server is
# reachable again two minutes later.
- name: Load new rules with a way back
  when: firewall_rules.changed or firewall_unit.changed
  block:
    - name: Schedule removing the rules
      ansible.builtin.command: >-
        systemd-run --collect --unit=host-firewall-rollback
        --on-active=120 /usr/sbin/nft delete table inet host
      changed_when: true

    - name: Load the rules
      ansible.builtin.systemd_service:
        name: host-firewall
        state: restarted

# The connection Ansible holds open is established and would pass any
# rules; only a new one proves that ssh still gets in.
- name: Drop the ssh connection
  ansible.builtin.meta: reset_connection

- name: Check that a new ssh connection gets through
  ansible.builtin.ping:

- name: Cancel removing the rules
  when: firewall_rules.changed or firewall_unit.changed
  ansible.builtin.command: systemctl stop host-firewall-rollback.timer
  changed_when: true
