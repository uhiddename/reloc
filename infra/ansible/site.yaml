# Brings a fresh Debian server to a running single-node k3s:
#   ansible-playbook site.yaml
# Safe to run again: every task describes a state, not an action, and does
# nothing when the server is already in it.
- name: Set up the k3s servers
  hosts: k3s
  # Ansible logs in as admin_user and becomes root through sudo for
  # every task; root itself can't log in (roles/sshd).
  become: true
  roles:
    - base
    - admin
    - sshd
    - k3s
